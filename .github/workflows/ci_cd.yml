name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8

      - name: Run linter
        run: flake8 app/ --max-line-length=88

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies for vulnerabilities
        run: pip-audit -r app/requirements.txt

      - name: Build Docker image
        run: docker build -t devops-final-app:latest ./app

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-final-app:latest
          severity: CRITICAL
          exit-code: '0'

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Checkov IaC scan
        run: |
          pip install checkov
          checkov -f docker-compose.yml --quiet

  deploy:
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build and start full stack
        run: docker compose up -d --build

      - name: Wait for app to become healthy
        run: |
          for i in {1..20}; do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "App is healthy."
              exit 0
            fi
            echo "Waiting for app... ($i/20)"
            sleep 3
          done
          echo "App failed to become healthy in time."
          docker compose logs app
          exit 1

      - name: Verify metrics endpoint
        run: curl -sf http://localhost:5000/metrics > /dev/null

      - name: Verify Prometheus target is up
        run: |
          sleep 5
          curl -sf http://localhost:9090/-/ready > /dev/null

      - name: Show running containers
        run: docker compose ps

      - name: Tear down stack
        if: always()
        run: docker compose down -v