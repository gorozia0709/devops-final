name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8

      - name: Run linter
        run: flake8 app/ --max-line-length=88

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies for vulnerabilities
        run: pip-audit -r app/requirements.txt

      - name: Build Docker image
        run: docker build -t devops-final-app:latest ./app

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-final-app:latest
          severity: CRITICAL
          exit-code: '0'

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Checkov IaC scan
        run: |
          pip install checkov
          checkov -f docker-compose.yml --quiet

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Read current environment
        id: env
        run: |
          CURRENT=$(cat ansible/active_slot.yml | grep active_slot | awk '{print $2}')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Decide next environment
        id: next
        run: |
          if [ "${{ steps.env.outputs.current }}" = "blue" ]; then
            echo "next=green" >> $GITHUB_OUTPUT
          else
            echo "next=blue" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to selected Render environment
        run: |
          if [ "${{ steps.next.outputs.next }}" = "green" ]; then
            curl ${{ secrets.RENDER_GREEN_DEPLOY_HOOK }}
          else
            curl ${{ secrets.RENDER_BLUE_DEPLOY_HOOK }}
          fi

      - name: Update active slot in repo
        run: |
          echo "active_slot: ${{ steps.next.outputs.next }}" > ansible/active_slot.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ansible/active_slot.yml
          git commit -m "ci: update active slot to ${{ steps.next.outputs.next }}"
          git push